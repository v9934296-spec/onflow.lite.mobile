# Railway config for the ARQ worker service.
# In the Railway dashboard: create a second service from this repo and set
# "Custom Config as Code" / config path to `railway.worker.toml` (or paste
# the same build/deploy block). Shares Postgres, Redis, and R2 env with the API.
#
# API service uses `railway.toml` (Dockerfile + alembic preDeploy + /health).
# Worker has no HTTP healthcheck — it only consumes ARQ jobs + hourly reaper cron.

[build]
dockerfilePath = "services/api/Dockerfile.worker"
watchPaths = ["services/api/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
